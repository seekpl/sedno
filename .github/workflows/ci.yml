name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Lint, typy, testy, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Zależności
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatowanie
        run: pnpm format:check

      - name: Typy
        run: pnpm typecheck

      - name: Testy jednostkowe
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Przeglądarka do testów e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Testy e2e
        run: pnpm test:e2e

      - name: Wyniki e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
